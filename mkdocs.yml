  - IPv6:
      - Johdanto: "13-ipv6/index.md"
      - IPv6: "13-ipv6/ipv6.md"
      - IPv6-osoitteet: "13-ipv6/ipv6-osoitteet.md"
      - Osoitteistus: "13-ipv6/osoitteistus.md"
      - Dual-stack: "13-ipv6/dual-stack.md"

  - Border Gateway Protocol (BGP):
      - Johdanto: "14-bgp/index.md"
      - BGP: "14-bgp/bgp.md"
      - Autonomous System: "14-bgp/autonomous-system.md"
      - Internetin reititys: "14-bgp/internet-routing.md"
      - Reititys internetissä: "14-bgp/reititys-internetissa.md"
