site_name: Tietoverkot
site_url: https://tietoverkot.pages.labranet.jamk.fi
site_description: Tekniset verkko-opas ja tietopohja JAMK -kurssilta
site_author: Tietoverkot -projekti
extra:
  language: fi
  version: {}
  feature:
    navigation.tabs: true
    navigation.top: true
    navigation.path: docs
    navigation.indexes: true
    navigation.footer: true
    search.suggest: true
    search.highlight: true
    content.code.annotate: true
    content.code.copy: true
    content.tooltips: true
    content.code.line-numbers: true
icon:
  repo: fontawesome/brands/github
plugins:
- search:
    separator: '[\s\-:_\'
    min_search_length: 2
    lang: fi
- mermaid2
markdown_extensions:
- toc:
    permalink: true
    toc_depth: 3
    permalink_depth: 3
    slugify: uslugify
- admonition
- attr_list
- def_list
- footnotes
- md_in_html
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.highlight:
    anchor_linenums: true
    auto_reference_links: true
- pymdownx.superfences:
    custom_span:
    - name: ruby
      class: ruby
    custom_fences:
    - name: mermaid
      class: mermaid
      format: '@@@_mermaid'
- pymdownx.emoji:
    emoji_generator: gemoji
- pymdownx.arithmatex
extra_css: []
extra_javascript: []
