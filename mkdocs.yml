site_name: Tietoverkot
site_description: Tekninen verkko-opas ja tietopohja JAMK-kurssilta
site_author: Tietoverkot -projekti

theme:
  name: material
  icon:
    repo: fontawesome/brands/github

extra:
  language: fi

  feature:
    navigation.tabs: true
    navigation.top: true
    navigation.path: "docs"
    navigation.indexes: true
    navigation.footer: true
    search.suggest: true
    search.highlight: true
    content.code.annotate: true
    content.code.copy: true
    content.tooltips: true
    content.code.line-numbers: true

# Palette
# palette:
#   - scheme: default
#     primary: indigo
#     accent: indigo
#     toggle:
#       icon: material/toggle-switch-off-outline
#       name: Vaihda tummaan teemaan
#
#   - scheme: slate
#     primary: indigo
#     accent: indigo
#     toggle:
#       icon: material/toggle-switch
#       name: Vaihda vaaleaan teemaan

# Fontit
# font:
#   text: Roboto
#   code: Roboto Mono

plugins:
  - search:
      separator: '[\s\-:_''#]+'
      lang:
        - fi

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3

  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html

  - pymdownx.inlinehilite
  - pymdownx.snippets

  - pymdownx.highlight:
      anchor_linenums: true

  - pymdownx.superfences

  - pymdownx.emoji:
      emoji_generator: !!python/name:pymdownx.emoji.to_svg

  - pymdownx.arithmatex

extra_css: []
extra_javascript: []

nav:
  - Etusivu: index.md

  - Johdatus tietoverkkoihin:
      - Johdanto: "01-johdatus/index.md"
      - Mitä on tietoverkko?: "01-johdatus/tietoverkko.md"
      - Verkon komponentit: "01-johdatus/verkon-komponentit.md"
      - Verkkotyypit: "01-johdatus/verkkotyypit.md"
      - Protokollat: "01-johdatus/protokollat.md"

  - Ethernet, kytkimet ja VLANit:
      - Johdanto: "02-ethernet/index.md"
      - Ethernet: "02-ethernet/ethernet.md"
      - MAC-osoitteet: "02-ethernet/mac-osoitteet.md"
      - Ethernet-kehys: "02-ethernet/frame.md"
      - Kytkentä (Switching): "02-ethernet/switching.md"
      - Virtual LAN (VLAN): "02-ethernet/vlan.md"
      - Trunking: "02-ethernet/trunking.md"

  - IPv4-osoitteet, aliverkot ja ARP:
      - Johdanto: "03-ipv4/index.md"
      - IPv4-protokolla: "03-ipv4/ipv4.md"
      - IP-osoite: "03-ipv4/ip-osoite.md"
      - Aliverkot (Subnet): "03-ipv4/aliverkot.md"
      - Subnetointi: "03-ipv4/subnetointi.md"
      - ARP: "03-ipv4/arp.md"
      - Broadcast-toiminta: "03-ipv4/broadcast.md"

  - DHCP ja staattinen reititys:
      - Johdanto: "04-dhcp-routing/index.md"
      - DHCP: "04-dhcp-routing/dhcp.md"
      - DHCP-prosessi: "04-dhcp-routing/dhcp-prosessi.md"
      - Oletusyhdyskäytävä: "04-dhcp-routing/oletusyhdyskayta.md"
      - Staattinen reititys: "04-dhcp-routing/staattinen-reititys.md"
      - Reititystaulu: "04-dhcp-routing/routing-table.md"

  - Verkkolaitteet ja kaapelointi:
      - Johdanto: "05-laitteet/index.md"
      - Kytkin: "05-laitteet/kytkin.md"
      - Reititin: "05-laitteet/reititin.md"
      - Palomuuri: "05-laitteet/palomuuri.md"
      - Verkkokortti: "05-laitteet/verkkokortti.md"
      - Kaapelointi: "05-laitteet/kaapelointi.md"

  - Spanning Tree:
      - Johdanto: "06-spanning-tree/index.md"
      - Verkkosilmukat: "06-spanning-tree/verkkosilmukat.md"
      - STP: "06-spanning-tree/stp.md"
      - RSTP: "06-spanning-tree/rstp.md"

  - IPv4-reititys:
      - Johdanto: "07-reititys/index.md"
      - Reititys: "07-reititys/routing.md"
      - Staattinen reititys: "07-reititys/staattinen-reititys.md"
      - Dynaaminen reititys: "07-reititys/dynaaminen-reititys.md"
      - OSPF: "07-reititys/ospf.md"

  - Verkon segmentointi ja palomuurit:
      - Johdanto: "08-verkon-turvallisuus/index.md"
      - Tietoturva-perusteet: "08-verkon-turvallisuus/tietoturva-perusteet.md"
      - Segmentointi: "08-verkon-turvallisuus/segmentointi.md"
      - Palomuuri: "08-verkon-turvallisuus/palomuuri.md"
      - Intrusiohawkistus (IDS/IPS): "08-verkon-turvallisuus/ips.md"
      - Virtuaalitietoverkot (VPN): "08-verkon-turvallisuus/vpn.md"
      - Liikenteen suodatus: "08-verkon-turvallisuus/liikenteen-suodatus.md"
      - Turvallinen verkkorakenne: "08-verkon-turvallisuus/turvallinen-verkkorakenne.md"

  - IPv4 NAT:
      - Johdanto: "09-ipv4-nat/index.md"
      - NAT-perusteet: "09-ipv4-nat/nat-perusteet.md"
      - NAT-tyypit: "09-ipv4-nat/nat-tyypit.md"
      - NAT-konfigurointi: "09-ipv4-nat/nat-konfigurointi.md"

  - TCP, UDP, SSH ja HTTP:
      - Johdanto: "10-tcp-udp-ssh-http/index.md"
      - TCP: "10-tcp-udp-ssh-http/tcp.md"
      - UDP: "10-tcp-udp-ssh-http/udp.md"
      - SSH: "10-tcp-udp-ssh-http/ssh.md"
      - HTTP: "10-tcp-udp-ssh-http/http.md"
      - TLS: "10-tcp-udp-ssh-http/tls.md"

  - Palvelimet, päätelaitteet ja WLAN:
      - Johdanto: "11-palvelimet-ja-wlan/index.md"
      - Palvelimet: "11-palvelimet-ja-wlan/palvelimet.md"
      - Päätelaitteet: "11-palvelimet-ja-wlan/paatelaitteet.md"
